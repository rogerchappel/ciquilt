name: risky-release

on:
  pull_request_target:

permissions:
  contents: write

jobs:
  release-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - run: echo "Review ${{ github.event.pull_request.title }}"
