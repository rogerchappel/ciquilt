name: Action sources
on: push
permissions: read-all
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Local action
        uses: ./local-action
      - name: Mutable Docker image
        uses: docker://alpine:3.20
      - name: Digested Docker image
        uses: docker://alpine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: Mutable remote action
        uses: actions/setup-node@v4
      - name: Pinned remote action
        uses: actions/checkout@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - name: Unsafe shell expression
        run: echo "${{ github.event.issue.title }}"
